name: Refresh report index

# Runs whenever a report is pushed into any reports/ subfolder
# (reports/ai-insights, reports/health-report, reports/performance-test, ...).
# The '!' lines stop the workflow reacting to its own index commits.
on:
  push:
    paths:
      - 'reports/**'
      - '!reports/index.json'
      - '!reports/**/index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Refresh report indexes
        run: |
          chmod +x tools/build-report-index.sh
          ./tools/build-report-index.sh

      - name: Commit index changes
        run: |
          git config user.name  "qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git add reports/
          git diff --quiet --cached || git commit -m "Update report indexes [skip ci]"
          git push
